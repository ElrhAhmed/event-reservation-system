# ==============================================================
# CONFIGURATION GÉNÉRALE
# ==============================================================
spring.application.name=EventReservationSystem
server.port=8080
vaadin.launch-browser=true

# ==============================================================
# BASE DE DONNÉES H2 (EMBEDDED)
# ==============================================================
spring.datasource.url=jdbc:h2:mem:eventdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 (CDC)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ==============================================================
# JPA / HIBERNATE
# ==============================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Hibernate crée le schéma au démarrage (adapté à data.sql)
spring.jpa.hibernate.ddl-auto=update

# Affichage SQL pour debug / rapport
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# IMPORTANT : exécuter data.sql APRÈS Hibernate
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ==============================================================
# SÉCURITÉ
# ==============================================================
# CustomUserDetailsService utilisé ? aucune config spring.security.user ici

# ==============================================================
# VAADIN
# ==============================================================
vaadin.productionMode=false
vaadin.whitelisted-packages=ma.projet.events

# ==============================================================
# UPLOAD FICHIERS (IMAGES ÉVÉNEMENTS)
# ==============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ==============================================================
# LOGGING (OPTIONNEL MAIS UTILE POUR LE JURY)
# ==============================================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE
