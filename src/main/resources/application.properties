# ==============================================================
# CONFIGURATION GÉNÉRALE
# ==============================================================
spring.application.name=EventReservationSystem
vaadin.launch-browser=true
server.port=8080

# ==============================================================
# BASE DE DONNÉES H2
# ==============================================================
spring.datasource.url=jdbc:h2:mem:eventdb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console H2 (Accessible via /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ==============================================================
# JPA / HIBERNATE
# ==============================================================
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# "update" est préférable à "create-drop" pour éviter des conflits avec le DataInitializer
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# DÉSACTIVER le fichier data.sql (car on utilise DataInitializer.java)
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# ==============================================================
# SÉCURITÉ (IMPORTANT)
# ==============================================================
# ?? NE JAMAIS METTRE spring.security.user ici quand on a un CustomUserDetailsService !
# Ces lignes ont été supprimées pour que la DB soit la seule source de vérité.

# ==============================================================
# VAADIN
# ==============================================================
vaadin.productionMode=false
# Autoriser le scan des packages pour les composants UI
vaadin.whitelisted-packages=ma.projet.events

# ==============================================================
# UPLOAD FICHIERS (Pour les images des événements)
# ==============================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB